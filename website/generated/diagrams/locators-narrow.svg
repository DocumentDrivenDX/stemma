      </g>
      <g class="lini-node lini-note lini-path" data-id="n6" style="stroke-width: 2" transform="translate(0,-64.5)">
        <path d="M -121 -28.5 L 106 -28.5 L 121 -13.5 L 121 28.5 L -121 28.5 Z"/>
