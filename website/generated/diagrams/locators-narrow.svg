      <rect x="-157" y="-774" width="314" height="1548" rx="8" ry="8"/>
      <g class="lini-node lini-box lini-block" data-id="n1" transform="translate(0,-709.5)">
        <rect x="-120" y="-27.5" width="240" height="55" rx="8" ry="8"/>
        <text class="lini-text" x="0" y="0" dy="0.358em">PDF paper or manual</text>
      </g>
      <g class="lini-node lini-note lini-path" data-id="n2" style="stroke-width: 2" transform="translate(0,-580.5)">
        <path d="M -121 -28.5 L 106 -28.5 L 121 -13.5 L 121 28.5 L -121 28.5 Z"/>
        <g class="lini-node lini-path" style="fill: var(--stm-color-line-strong); stroke: none; stroke-width: 0" transform="translate(0,0)">
          <path d="M 106 -28.5 L 121 -13.5 L 106 -13.5 Z"/>
        </g>
        <text class="lini-text" x="0" y="0" dy="0.358em">Printed page number</text>
      </g>
      <g class="lini-node lini-box lini-block" data-id="n3" transform="translate(0,-451.5)">
        <rect x="-120" y="-27.5" width="240" height="55" rx="8" ry="8"/>
        <text class="lini-text" x="0" y="0" dy="0.358em">Web page you saved</text>
      </g>
      <g class="lini-node lini-note lini-path" data-id="n4" style="stroke-width: 2" transform="translate(0,-322.5)">
        <path d="M -121 -28.5 L 106 -28.5 L 121 -13.5 L 121 28.5 L -121 28.5 Z"/>
        <g class="lini-node lini-path" style="fill: var(--stm-color-line-strong); stroke: none; stroke-width: 0" transform="translate(0,0)">
          <path d="M 106 -28.5 L 121 -13.5 L 106 -13.5 Z"/>
        </g>
        <text class="lini-text" x="0" y="0" dy="0.358em">Paragraph or chapter</text>
      </g>
      <g class="lini-node lini-box lini-block" data-id="n5" transform="translate(0,-193.5)">
        <rect x="-120" y="-27.5" width="240" height="55" rx="8" ry="8"/>
