<svg xmlns="http://www.w3.org/2000/svg" viewBox="-129 -746 258 1492" width="258" height="1492" class="lini" role="img" aria-labelledby="dgm-locators-narrow-title dgm-locators-narrow-desc">
  <title id="dgm-locators-narrow-title">What Stemma reads, and how each is cited</title>
  <desc id="dgm-locators-narrow-desc">6 kinds of source, from each to how a place in it is cited. Each box on the left leads to the box beside it on the right.</desc>
  <g class="lini-scene">
