<svg xmlns="http://www.w3.org/2000/svg" viewBox="-286 -359 572 718" width="572" height="718" class="lini" role="img" aria-labelledby="dgm-locators-title dgm-locators-desc">
  <title id="dgm-locators-title">What Stemma reads, and how each is cited</title>
  <desc id="dgm-locators-desc">6 kinds of source, from each to how a place in it is cited. Each box on the left leads to the box beside it on the right.</desc>
  <g class="lini-scene">
