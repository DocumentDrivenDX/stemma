        <path d="M -121 -28.5 L 106 -28.5 L 121 -13.5 L 121 28.5 L -121 28.5 Z"/>
        <g class="lini-node lini-path" style="fill: var(--stm-color-line-strong); stroke: none; stroke-width: 0" transform="translate(0,0)">
          <path d="M 106 -28.5 L 121 -13.5 L 106 -13.5 Z"/>
        </g>
        <text class="lini-text" x="0" y="0" dy="0.358em">That source&apos;s text</text>
      </g>
      <g class="lini-node lini-box lini-block" data-id="n7" transform="translate(0,193.5)">
        <rect x="-120" y="-27.5" width="240" height="55" rx="8" ry="8"/>
